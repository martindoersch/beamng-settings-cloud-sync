<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d3b5c"/><stop offset="1" stop-color="#0f1c2b"/></linearGradient></defs><rect width="1920" height="1080" fill="url(#bg)"/><text x="120" y="130" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="72" font-weight="bold" fill="#ffffff" text-anchor="start">A simple UI app</text><text x="120" y="188" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="normal" fill="#a9b8c8" text-anchor="start">Set it up once – then it works by itself, on PC and in cloud gaming</text><rect x="120" y="230" width="740" height="800" rx="16" fill="#05080c" fill-opacity="0.8" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/><text x="152" y="292" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="start">Settings Cloud Sync</text><rect x="776" y="256" width="56" height="48" rx="10" fill="#e8edf2"/><line x1="792" y1="280" x2="816" y2="280" stroke="#0b1220" stroke-width="5" stroke-linecap="round"/><text x="152" y="364" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="normal" fill="#ffffff" text-anchor="start">Profile</text><rect x="252" y="330" width="250" height="50" rx="8" fill="#1a2533" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/><text x="270" y="364" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="normal" fill="#ffffff" text-anchor="start">Boosteroid</text><polygon points="470,348 488,348 479,362" fill="#ffffff"/><rect x="518" y="330" width="196" height="50" rx="8" fill="#1a2533" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/><text x="534" y="364" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="normal" fill="#6b7a8c" text-anchor="start">new profile</text><rect x="728" y="330" width="100" height="50" rx="10" fill="#e8edf2"/><text x="778" y="365" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#0b1220" text-anchor="middle">Add</text><text x="152" y="412" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#a9b8c8" text-anchor="start">e.g. one per PC; only this machine switches</text><line x1="152" y1="434" x2="828" y2="434" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/><rect x="152" y="452" width="44" height="44" rx="8" fill="#5cc8ff"/><polyline points="162,474 172,484 188,464" fill="none" stroke="#0b1220" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="216" y="486" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="normal" fill="#ffffff" text-anchor="start">Controls &amp; key bindings</text><text x="216" y="522" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#a9b8c8" text-anchor="start">1 file, 2026-11-09 21:15</text><rect x="152" y="544" width="44" height="44" rx="8" fill="#5cc8ff"/><polyline points="162,566 172,576 188,556" fill="none" stroke="#0b1220" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="216" y="578" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="normal" fill="#ffffff" text-anchor="start">Other settings (graphics, UI layouts etc.)</text><text x="216" y="614" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#a9b8c8" text-anchor="start">8 files, 2026-11-09 21:15</text><rect x="152" y="636" width="192" height="56" rx="10" fill="#e8edf2"/><text x="248.0" y="674" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#0b1220" text-anchor="middle">Export</text><rect x="364" y="636" width="192" height="56" rx="10" fill="#e8edf2"/><text x="460.0" y="674" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#0b1220" text-anchor="middle">Import</text><text x="152" y="734" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#a9b8c8" text-anchor="start">Current: 2026-11-09 21:15 · Boosteroid PC (9 files)</text><text x="152" y="794" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="normal" fill="#ffffff" text-anchor="start">Older</text><rect x="236" y="760" width="420" height="50" rx="8" fill="#1a2533" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/><text x="252" y="793" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#ffffff" text-anchor="start">2026-11-09 19:49 · unknown PC</text><polygon points="626,778 644,778 635,792" fill="#ffffff"/><rect x="672" y="760" width="156" height="50" rx="10" fill="#e8edf2"/><text x="750" y="795" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#0b1220" text-anchor="middle">Restore</text><line x1="152" y1="832" x2="828" y2="832" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/><rect x="152" y="850" width="44" height="44" rx="8" fill="#5cc8ff"/><polyline points="162,872 172,882 188,862" fill="none" stroke="#0b1220" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="216" y="884" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="normal" fill="#ffffff" text-anchor="start">Auto-import at game start</text><text x="216" y="918" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#a9b8c8" text-anchor="start">when the cloud backup is newer</text><rect x="152" y="940" width="44" height="44" rx="8" fill="#5cc8ff"/><polyline points="162,962 172,972 188,952" fill="none" stroke="#0b1220" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="216" y="974" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="normal" fill="#ffffff" text-anchor="start">Auto-export changes</text><text x="216" y="1008" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#a9b8c8" text-anchor="start">saves within a minute, after an import or export</text><polyline points="854,280 900,280 930,300 940,300" fill="none" stroke="#ff8a3d" stroke-width="3" stroke-dasharray="8 8"/><circle cx="970" cy="300" r="30" fill="#ff8a3d"/><text x="970" y="312" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="1030" y="312" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="bold" fill="#ffffff" text-anchor="start">Minimize it or use the radial menu</text><text x="1030" y="358" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="normal" fill="#a9b8c8" text-anchor="start">Export, import and restore without</text><text x="1030" y="398" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="normal" fill="#a9b8c8" text-anchor="start">keeping the app on screen</text><polyline points="854,355 900,355 930,480 940,480" fill="none" stroke="#ff8a3d" stroke-width="3" stroke-dasharray="8 8"/><circle cx="970" cy="480" r="30" fill="#ff8a3d"/><text x="970" y="492" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><text x="1030" y="492" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="bold" fill="#ffffff" text-anchor="start">One profile per machine</text><text x="1030" y="538" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="normal" fill="#a9b8c8" text-anchor="start">Desktop, laptop, cloud gaming –</text><text x="1030" y="578" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="normal" fill="#a9b8c8" text-anchor="start">each keeps its own graphics settings</text><polyline points="854,785 900,785 930,660 940,660" fill="none" stroke="#ff8a3d" stroke-width="3" stroke-dasharray="8 8"/><circle cx="970" cy="660" r="30" fill="#ff8a3d"/><text x="970" y="672" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><text x="1030" y="672" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="bold" fill="#ffffff" text-anchor="start">Backup history</text><text x="1030" y="718" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="normal" fill="#a9b8c8" text-anchor="start">Your last 3 backups with date and PC –</text><text x="1030" y="758" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="normal" fill="#a9b8c8" text-anchor="start">restore one with a click</text><polyline points="854,930 900,930 930,840 940,840" fill="none" stroke="#ff8a3d" stroke-width="3" stroke-dasharray="8 8"/><circle cx="970" cy="840" r="30" fill="#ff8a3d"/><text x="970" y="852" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text><text x="1030" y="852" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="bold" fill="#ffffff" text-anchor="start">Auto-import and auto-export</text><text x="1030" y="898" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="normal" fill="#a9b8c8" text-anchor="start">Restores at game start, saves changes</text><text x="1030" y="938" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="normal" fill="#a9b8c8" text-anchor="start">by itself – ideal for cloud gaming</text></svg>
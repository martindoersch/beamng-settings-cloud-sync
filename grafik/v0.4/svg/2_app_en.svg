<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d3b5c"/><stop offset="1" stop-color="#0f1c2b"/></linearGradient></defs><rect width="1920" height="1080" fill="url(#bg)"/><text x="120" y="150" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="72" font-weight="bold" fill="#ffffff" text-anchor="start">A simple UI app</text><text x="120" y="212" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="normal" fill="#a9b8c8" text-anchor="start">Add it via UI Apps – works on PC and cloud gaming</text><rect x="120" y="270" width="740" height="640" rx="16" fill="#05080c" fill-opacity="0.8" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/><text x="152" y="330" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="start">Settings Cloud Sync</text><text x="152" y="394" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="normal" fill="#ffffff" text-anchor="start">Profile</text><rect x="252" y="360" width="250" height="50" rx="8" fill="#1a2533" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/><text x="270" y="394" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="normal" fill="#ffffff" text-anchor="start">Boosteroid</text><polygon points="470,378 488,378 479,392" fill="#ffffff"/><rect x="518" y="360" width="196" height="50" rx="8" fill="#1a2533" stroke="#ffffff" stroke-opacity="0.2" stroke-width="2"/><text x="534" y="394" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="normal" fill="#6b7a8c" text-anchor="start">new profile</text><rect x="728" y="360" width="100" height="50" rx="10" fill="#e8edf2"/><text x="778" y="395" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="bold" fill="#0b1220" text-anchor="middle">Add</text><text x="152" y="444" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#a9b8c8" text-anchor="start">e.g. one per PC; only this machine switches</text><line x1="152" y1="470" x2="828" y2="470" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/><rect x="152" y="494" width="44" height="44" rx="8" fill="#5cc8ff"/><polyline points="162,516 172,526 188,506" fill="none" stroke="#0b1220" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="216" y="528" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="normal" fill="#ffffff" text-anchor="start">Controls &amp; key bindings</text><text x="216" y="566" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#a9b8c8" text-anchor="start">1 file, 2026-11-07 09:39</text><rect x="152" y="594" width="44" height="44" rx="8" fill="#5cc8ff"/><polyline points="162,616 172,626 188,606" fill="none" stroke="#0b1220" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="216" y="628" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="normal" fill="#ffffff" text-anchor="start">Other settings (graphics, UI layouts etc.)</text><text x="216" y="666" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#a9b8c8" text-anchor="start">7 files, 2026-11-07 09:39</text><rect x="152" y="696" width="192" height="56" rx="10" fill="#e8edf2"/><text x="248.0" y="734" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#0b1220" text-anchor="middle">Export</text><rect x="364" y="696" width="192" height="56" rx="10" fill="#e8edf2"/><text x="460.0" y="734" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#0b1220" text-anchor="middle">Import</text><rect x="152" y="784" width="44" height="44" rx="8" fill="#5cc8ff"/><polyline points="162,806 172,816 188,796" fill="none" stroke="#0b1220" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="216" y="818" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="normal" fill="#ffffff" text-anchor="start">Auto-import at game start</text><text x="216" y="856" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#a9b8c8" text-anchor="start">when the cloud backup is newer. Fresh machines</text><text x="216" y="884" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="normal" fill="#a9b8c8" text-anchor="start">use profile 'Boosteroid'</text><polyline points="854,385 900,385 930,330 940,330" fill="none" stroke="#ff8a3d" stroke-width="3" stroke-dasharray="8 8"/><circle cx="970" cy="330" r="30" fill="#ff8a3d"/><text x="970" y="342" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text><text x="1030" y="342" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="bold" fill="#ffffff" text-anchor="start">One profile per machine</text><text x="1030" y="388" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="normal" fill="#a9b8c8" text-anchor="start">Desktop, laptop, cloud gaming –</text><text x="1030" y="428" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="normal" fill="#a9b8c8" text-anchor="start">each keeps its own graphics settings</text><polyline points="854,580 900,580 930,510 940,510" fill="none" stroke="#ff8a3d" stroke-width="3" stroke-dasharray="8 8"/><circle cx="970" cy="510" r="30" fill="#ff8a3d"/><text x="970" y="522" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><text x="1030" y="522" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="bold" fill="#ffffff" text-anchor="start">Choose what to sync</text><text x="1030" y="568" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="normal" fill="#a9b8c8" text-anchor="start">Key bindings, graphics and other settings</text><polyline points="854,724 900,724 930,680 940,680" fill="none" stroke="#ff8a3d" stroke-width="3" stroke-dasharray="8 8"/><circle cx="970" cy="680" r="30" fill="#ff8a3d"/><text x="970" y="692" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><text x="1030" y="692" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="bold" fill="#ffffff" text-anchor="start">Export here, import there</text><text x="1030" y="738" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="normal" fill="#a9b8c8" text-anchor="start">Your old files are backed up before each import</text><polyline points="854,806 900,806 930,850 940,850" fill="none" stroke="#ff8a3d" stroke-width="3" stroke-dasharray="8 8"/><circle cx="970" cy="850" r="30" fill="#ff8a3d"/><text x="970" y="862" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text><text x="1030" y="862" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="bold" fill="#ffffff" text-anchor="start">Auto-import at game start</text><text x="1030" y="908" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="normal" fill="#a9b8c8" text-anchor="start">Restores your profile on every fresh machine –</text><text x="1030" y="948" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="normal" fill="#a9b8c8" text-anchor="start">ideal for cloud gaming</text></svg>
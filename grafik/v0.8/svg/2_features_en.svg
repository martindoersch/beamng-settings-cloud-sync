<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1d3b5c"/><stop offset="1" stop-color="#0f1c2b"/></linearGradient></defs><rect width="1920" height="1080" fill="url(#bg)"/><text x="120" y="120" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="72" font-weight="bold" fill="#ffffff" text-anchor="start">Set it up once</text><text x="120" y="176" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="normal" fill="#a9b8c8" text-anchor="start">Then it works by itself, on PC and in cloud gaming</text><rect x="120" y="240" width="540" height="380" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/><g transform="translate(390.0,360)"><rect x="-80" y="-56" width="160" height="112" rx="12" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><line x1="-80" y1="-24" x2="80" y2="-24" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><line x1="-56" y1="4" x2="40" y2="4" fill="none" stroke="#ff8a3d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><line x1="-56" y1="30" x2="16" y2="30" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.6"/><text x="-62" y="-32" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#ffffff" text-anchor="start">ESC</text></g><text x="390.0" y="492" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="bold" fill="#ffffff" text-anchor="middle">In the pause menu</text><text x="390.0" y="540" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="normal" fill="#a9b8c8" text-anchor="middle">ESC &gt; Mods &gt; Settings Cloud Sync,</text><text x="390.0" y="578" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="normal" fill="#a9b8c8" text-anchor="middle">all options in one place</text><rect x="690" y="240" width="540" height="380" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/><g transform="translate(960.0,360)"><g transform="scale(1.2)"><path d="M -50 40 A 30 30 0 0 1 -48 -18 A 46 46 0 0 1 38 -30 A 36 36 0 0 1 52 40 Z" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M -16.8 -7.2 A 23 23 0 0 1 20.8 -7.2" fill="none" stroke="#ff8a3d" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="22.2,-19.2 20.8,-7.2 9.1,-10.0" fill="none" stroke="#ff8a3d" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M 20.8 19.2 A 23 23 0 0 1 -16.8 19.2" fill="none" stroke="#ff8a3d" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="-18.2,31.2 -16.8,19.2 -5.1,22.0" fill="none" stroke="#ff8a3d" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="960.0" y="492" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="bold" fill="#ffffff" text-anchor="middle">Auto-import and export</text><text x="960.0" y="540" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="normal" fill="#a9b8c8" text-anchor="middle">Restored at game start, changes</text><text x="960.0" y="578" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="normal" fill="#a9b8c8" text-anchor="middle">saved by themselves</text><rect x="1260" y="240" width="540" height="380" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/><g transform="translate(1530.0,360)"><circle cx="-40" cy="0" r="46" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><polyline points="-62,0 -46,16 -18,-14" fill="none" stroke="#ff8a3d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M 24 -26 L 56 -26 A 28 28 0 0 1 56 30 L 28 30" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><polyline points="38,-42 22,-26 38,-10" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1530.0" y="492" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="bold" fill="#ffffff" text-anchor="middle">Sync status and undo</text><text x="1530.0" y="540" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="normal" fill="#a9b8c8" text-anchor="middle">See at a glance if you are in sync;</text><text x="1530.0" y="578" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="normal" fill="#a9b8c8" text-anchor="middle">undo puts your old settings back</text><rect x="120" y="650" width="540" height="380" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/><g transform="translate(390.0,770)"><rect x="-92" y="-54" width="100" height="68" rx="8" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><line x1="-42.0" y1="14" x2="-42.0" y2="30" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><line x1="-64.0" y1="32" x2="-20.0" y2="32" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="-4" y="-24" width="100" height="68" rx="8" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><line x1="46.0" y1="44" x2="46.0" y2="60" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><line x1="24.0" y1="62" x2="68.0" y2="62" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="46" cy="10" r="14" fill="none" stroke="#ff8a3d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="390.0" y="902" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="bold" fill="#ffffff" text-anchor="middle">Profiles per machine</text><text x="390.0" y="950" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="normal" fill="#a9b8c8" text-anchor="middle">Each PC keeps its own</text><text x="390.0" y="988" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="normal" fill="#a9b8c8" text-anchor="middle">graphics settings</text><rect x="690" y="650" width="540" height="380" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/><g transform="translate(960.0,770)"><rect x="-80" y="-50" width="34" height="34" rx="6" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="-38" y="-50" width="34" height="34" rx="6" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="4" y="-50" width="34" height="34" rx="6" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="46" y="-50" width="34" height="34" rx="6" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="-80" y="-4" width="34" height="34" rx="6" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="-38" y="-4" width="118" height="34" rx="6" fill="none" stroke="#ff8a3d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><line x1="-60" y1="56" x2="60" y2="56" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.6"/></g><text x="960.0" y="902" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="bold" fill="#ffffff" text-anchor="middle">Shared key bindings</text><text x="960.0" y="950" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="normal" fill="#a9b8c8" text-anchor="middle">Same controls in every profile</text><rect x="1260" y="650" width="540" height="380" rx="18" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.18" stroke-width="2"/><g transform="translate(1530.0,770)"><path d="M -50.2 13.5 A 52 52 0 1 1 -26.0 45.0" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><polyline points="-43.0,-1.9 -50.2,13.5 -64.2,3.7" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><polyline points="0,-30 0,0 22,14" fill="none" stroke="#ff8a3d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1530.0" y="902" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="bold" fill="#ffffff" text-anchor="middle">Older backups</text><text x="1530.0" y="950" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="normal" fill="#a9b8c8" text-anchor="middle">The last three backups per profile,</text><text x="1530.0" y="988" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="normal" fill="#a9b8c8" text-anchor="middle">restore any of them</text></svg>
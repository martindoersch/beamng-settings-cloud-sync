ttings Cloud Sync –</text><text x="1030" y="388" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="normal" fill="#a9b8c8" text-anchor="start">the UI app is optional</text><polyline points="854,333 900,333 930,448 940,448" fill="none" stroke="#ff8a3d" stroke-width="3" stroke-dasharray="8 8"/><circle cx="970" cy="448" r="30" fill="#ff8a3d"/><text x="970" y="460" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text><text x="1030" y="460" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="bold" fill="#ffffff" text-anchor="start">Profiles per machine</text><text x="1030" y="506" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="normal" fill="#a9b8c8" text-anchor="start">Add, rename, delete – each machine</text><text x="1030" y="546" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="normal" fill="#a9b8c8" text-anchor="start">keeps its own graphics settings</text><polyline points="854,660 900,660 930,606 940,606" fill="none" stroke="#ff8a3d" stroke-width="3" stroke-dasharray="8 8"/><circle cx="970" cy="606" r="30" fill="#ff8a3d"/><text x="970" y="618" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text><text x="1030" y="618" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="bold" fill="#ffffff" text-anchor="start">Sync status and undo</text><text x="1030" y="664" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="normal" fill="#a9b8c8" text-anchor="start">Green means it is in the cloud backup;</text><text x="1030" y="704" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="normal" fill="#a9b8c8" text-anchor="start">undo puts your old settings back</text><polyline points="854,900 900,900 930,764 940,764" fill="none" stroke="#ff8a3d" stroke-width="3" stroke-dasharray="8 8"/><circle cx="970" cy="764" r="30" fill="#ff8a3d"/><text x="970" y="776" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text><text x="1030" y="776" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="bold" fill="#ffffff" text-anchor="start">Shared key bindings, auto-sync</text><text x="1030" y="822" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="normal" fill="#a9b8c8" text-anchor="start">Same controls in every profile,</text><text x="1030" y="862" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="normal" fill="#a9b8c8" text-anchor="start">restored and saved by itself</text><polyline points="854,1012 900,1012 930,922 940,922" fill="none" stroke="#ff8a3d" stroke-width="3" stroke-dasharray="8 8"/><circle cx="970" cy="922" r="30" fill="#ff8a3d"/><text x="970" y="934" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text><text x="1030" y="934" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="bold" fill="#ffffff" text-anchor="start">Restore your mods</text><text x="1030" y="980" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="normal" fill="#a9b8c8" text-anchor="start">One click subscribes your repository</text><text x="1030" y="1020" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="normal" fill="#a9b8c8" text-anchor="start">mods again in a fresh cloud session</text></svg>